[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "session-autopsy"
version = "0.1.0"
description = "Local session accounting and bounded cost analysis for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
session-autopsy = "session_autopsy.cli:main"

[dependency-groups]
dev = ["coverage>=7.6,<8"]

[tool.setuptools.packages.find]
include = ["session_autopsy*"]

[tool.setuptools.package-data]
session_autopsy = ["data/*.json"]

[tool.coverage.run]
source = ["session_autopsy"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
